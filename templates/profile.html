<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile</title>

<style>
body {
    font-family: Arial;
    background: #f0f2f5;
}

.container {
    display: flex;
    width: 80%;
    margin: 50px auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* LEFT SIDE */
.left {
    width: 30%;
    text-align: center;
    padding: 20px;
    border-right: 1px solid #ddd;
}

.left img {
    width: 150px;
    border-radius: 10px;
}

/* RIGHT SIDE */
.right {
    width: 70%;
    padding: 20px;
}

/* Tabs */
.tabs button {
    margin-right: 10px;
    padding: 8px 15px;
    border: none;
    background: purple;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

/* Sections */
.section {
    display: none;
    margin-top: 20px;
}

.section.active {
    display: block;
}
</style>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <img src="https://via.placeholder.com/150" alt="Profile">
        <h2>{{ user.name if user.name else "User" }}</h2>
    </div>

    <!-- RIGHT -->
    <div class="right">

        <!-- Tabs -->
        <div class="tabs">
            <button onclick="showSection('about')">About</button>
            <button onclick="showSection('family')">Family Tree</button>
            <button onclick="showSection('friends')">Friend Tree</button>
        </div>

        <!-- About -->
        <div id="about" class="section active">
            <p><b>Your Health Status:</b> 
              <span class="{{ user.health_status | lower }}">
                  {{ user.health_status }}
              </span>
            </p>

                  {% if user.family and user.family.children %}
                 {% for member in user.family.children %}
            <p>
            <b>{{ member.name }} Health Status:</b> 
            <span class="{{ member.status | lower }}">
                {{ member.status }}
            </span>
            </p>
                 {% endfor %}
                 {% endif %}
        </div>

        <!-- Family -->
        <div id="family" class="section">
    <h3>Family Tree</h3>

    <div id="familyTree" style="height: 400px; border: 1px solid #ccc;"></div>

    <script>
        var nodes = new vis.DataSet([
            { id: 1, label: "Grandfather" },
            { id: 2, label: "Grandmother" },
            { id: 3, label: "Father" },
            { id: 4, label: "Mother" },
            { id: 5, label: "{{ user.name }}" }
        ]);

        var edges = new vis.DataSet([
            { from: 1, to: 3 },
            { from: 2, to: 3 },
            { from: 3, to: 5 },
            { from: 4, to: 5 }
        ]);

        var container = document.getElementById("familyTree");

        var data = {
            nodes: nodes,
            edges: edges
        };

        var options = {
            layout: {
                hierarchical: {
                    direction: "UD",   // Up -> Down
                    sortMethod: "directed"
                }
            },
            nodes: {
                shape: "box",
                color: "#6a1b9a",
                font: { color: "white" }
            },
            edges: {
                arrows: "to"
            }
        };

        new vis.Network(container, data, options);
    </script>
</div>

        <!-- Friends -->
        <div id="friends" class="section">
    <h3>Friend Tree</h3>

    <div id="friendGraph" style="height: 450px; border: 1px solid #ccc;"></div>

    <script>
       var nodes = new vis.DataSet([
    // YOU (center)
    { id: 1, label: "{{ user.name }}", size: 35, color: "#ff5722", font: { size: 18 } },

    // Categories (BIG + BOX)
    { id: 2, label: "Job", shape: "box", color: "#2196f3", font: { color: "white" } },
    { id: 3, label: "School", shape: "box", color: "#4caf50", font: { color: "white" } },
    { id: 4, label: "Home", shape: "box", color: "#ff9800", font: { color: "white" } },
    { id: 5, label: "Others", shape: "box", color: "#9c27b0", font: { color: "white" } },

    // Job friends
    { id: 6, label: "J1" },
    { id: 7, label: "J2" },
    { id: 8, label: "J3" },

    // School friends
    { id: 9, label: "S1" },
    { id: 10, label: "S2" },
    { id: 11, label: "S3" },

    // Home friends
    { id: 12, label: "H1" },
    { id: 13, label: "H2" },
    { id: 14, label: "H3" },

    // Others friends
    { id: 15, label: "O1" },
    { id: 16, label: "O2" },
    { id: 17, label: "O3" }
    ]);

        var edges = new vis.DataSet([
            // Connect YOU to categories
            { from: 1, to: 2 },
            { from: 1, to: 3 },
            { from: 1, to: 4 },
            { from: 1, to: 5 },

            // Job → friends
            { from: 2, to: 6 },
            { from: 2, to: 7 },
            { from: 2, to: 8 },

            // School → friends
            { from: 3, to: 9 },
            { from: 3, to: 10 },
            { from: 3, to: 11 },

            // Home → friends
            { from: 4, to: 12 },
            { from: 4, to: 13 },
            { from: 4, to: 14 },

            // Others → friends
            { from: 5, to: 15 },
            { from: 5, to: 16 },
            { from: 5, to: 17 }
        ]);

        var container = document.getElementById("friendGraph");

        var data = {
            nodes: nodes,
            edges: edges
        };

        var options = {
    physics: {
        barnesHut: {
            gravitationalConstant: -2000,
            springLength: 120
        }
    },
    nodes: {
        shape: "dot",
        size: 15
    }
        };

        new vis.Network(container, data, options);
    </script>
</div>
    </div>

</div>

<script>
function showSection(id) {
    let sections = document.querySelectorAll('.section');
    sections.forEach(sec => sec.classList.remove('active'));

    document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
